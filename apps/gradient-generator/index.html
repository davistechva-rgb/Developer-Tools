<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gradient Generator | Developer Tools</title>
<meta name="description" content="Linear and radial CSS gradients with live preview">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="../../icon.svg">
<link rel="manifest" href="../../manifest.webmanifest">
<script>try{var t=localStorage.getItem("dt:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
.prevg{height:300px;border-radius:var(--r);border:1px solid var(--line)}
.sec{font:700 1rem/1.3 var(--ui);margin:22px 0 8px}
.stop{display:grid;grid-template-columns:40px 100px 1fr 3.2em auto;gap:8px;align-items:center;margin-bottom:8px}
.stop input[type=color]{width:40px;height:36px;border:1px solid var(--line);padding:2px;background:var(--inset);border-radius:var(--r)}
.stop input[type=text]{padding:7px 8px}.stop output{font-family:var(--mono);font-size:.85rem;text-align:right}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.presets button{background:none;border:1px solid var(--line);border-radius:var(--r);padding:6px;color:var(--ink);font:700 .85rem var(--ui);cursor:pointer;display:grid;gap:6px}
.presets button:hover{border-color:var(--line-strong)}.presets span{height:48px;border-radius:1px}
@media (max-width:520px){.stop{grid-template-columns:40px 1fr 3.2em;}.stop input[type=text],.stop button{grid-column:span 1}}
</style>
</head>
<body>
<main class="wrap">

<div class="cols wide-left">
 <section class="panel"><div class="prevg" id="prev" role="img" aria-label="Gradient preview"></div>
  <pre class="out wrapit mt" id="css" style="min-height:0"></pre>
  <div class="row mt"><button class="btn primary" type="button" id="cp">Copy CSS</button><button class="btn sm ghost" type="button" id="rnd">Random</button></div>
  <h2 class="sec">Starting points</h2><div class="presets" id="presets"></div></section>
 <section class="panel"><div class="panel-h"><h2>Settings</h2></div>
  <div class="seg" role="group" aria-label="Type"><button type="button" data-t="linear">Linear</button><button type="button" data-t="radial">Radial</button><button type="button" data-t="conic">Conic</button></div>
  <div id="angW" class="mt"><label class="lbl" for="ang">Angle: <span id="angV"></span></label><input type="range" id="ang" min="0" max="360"></div>
  <div id="shpW" class="mt" hidden><label class="lbl" for="shape">Shape</label><select id="shape"><option value="circle">Circle</option><option value="ellipse">Ellipse</option></select></div>
  <div id="posW" class="mt" hidden><label class="lbl" for="pos">Center</label><select id="pos"><option>center</option><option>top</option><option>bottom</option><option>left</option><option>right</option><option>top left</option><option>top right</option><option>bottom left</option><option>bottom right</option></select></div>
  <h2 class="sec">Color stops</h2><div id="stops"></div>
  <button class="btn sm mt" type="button" id="add">Add a stop</button>
 </section>
</div>
</main>
<script src="../../shared/color.js"></script>
<script src="../../shared/tools.js"></script>
<script src="../../shared/kit.js"></script>
<script>
DT.mount("gradient-generator");

const $=DT.$;const PRE=[["Blueprint",{t:"linear",a:160,stops:[["#0F2A4A",0],["#1F4E85",100]]}],["Dusk",{t:"linear",a:135,stops:[["#2E1760",0],["#E0467C",55],["#F2B33D",100]]}],
 ["Mint",{t:"linear",a:90,stops:[["#D8F3DC",0],["#52B788",100]]}],["Steel",{t:"linear",a:180,stops:[["#E6EEF6",0],["#8FA3B8",100]]}],["Glow",{t:"radial",shape:"circle",pos:"center",stops:[["#F2B33D",0],["#0F2A4A",70]]}],["Wheel",{t:"conic",a:0,pos:"center",stops:[["#ff0000",0],["#ffff00",17],["#00ff00",33],["#00ffff",50],["#0000ff",67],["#ff00ff",83],["#ff0000",100]]}]];
let s=Object.assign({t:"linear",a:135,shape:"circle",pos:"center",stops:[["#1F4E85",0],["#F2B33D",100]]},DT.get("grad",{}));
function css(){const st=[...s.stops].sort((a,b)=>a[1]-b[1]).map(([c,p])=>`${c} ${p}%`).join(", ");
 if(s.t==="linear")return`linear-gradient(${s.a}deg, ${st})`;if(s.t==="radial")return`radial-gradient(${s.shape} at ${s.pos}, ${st})`;return`conic-gradient(from ${s.a}deg at ${s.pos}, ${st})`}
function run(){DT.set("grad",s);const g=css();$("#prev").style.background=g;$("#css").textContent=`background: ${s.stops[0][0]};\nbackground: ${g};`;
 DT.$$("[data-t]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===s.t));$("#angW").hidden=s.t==="radial";$("#shpW").hidden=s.t!=="radial";$("#posW").hidden=s.t==="linear";
 $("#ang").value=s.a;$("#angV").textContent=s.a+"°";$("#shape").value=s.shape;$("#pos").value=s.pos}
function stops(){$("#stops").innerHTML=s.stops.map(([c,p],i)=>`<div class="stop"><input type="color" value="${c}" data-c="${i}" aria-label="Stop ${i+1} color"><input type="text" value="${c}" data-h="${i}" aria-label="Stop ${i+1} hex" spellcheck="false"><input type="range" min="0" max="100" value="${p}" data-p="${i}" aria-label="Stop ${i+1} position"><output>${p}%</output><button class="btn sm ghost" type="button" data-r="${i}" ${s.stops.length<3?"disabled":""} aria-label="Remove stop ${i+1}">Remove</button></div>`).join("");
 DT.$$("[data-c]").forEach(e=>e.oninput=()=>{s.stops[e.dataset.c][0]=e.value;e.nextElementSibling.value=e.value;run()});
 DT.$$("[data-h]").forEach(e=>e.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(e.value)){s.stops[e.dataset.h][0]=e.value;e.previousElementSibling.value=e.value;run()}});
 DT.$$("[data-p]").forEach(e=>e.oninput=()=>{s.stops[e.dataset.p][1]=+e.value;e.nextElementSibling.textContent=e.value+"%";run()});
 DT.$$("[data-r]").forEach(e=>e.onclick=()=>{s.stops.splice(+e.dataset.r,1);stops();run()})}
DT.$$("[data-t]").forEach(b=>b.onclick=()=>{s.t=b.dataset.t;run()});
$("#ang").oninput=e=>{s.a=+e.target.value;run()};$("#shape").onchange=e=>{s.shape=e.target.value;run()};$("#pos").onchange=e=>{s.pos=e.target.value;run()};
$("#add").onclick=()=>{const hx=()=>"#"+Array.from(crypto.getRandomValues(new Uint8Array(3)),x=>x.toString(16).padStart(2,"0")).join("");s.stops.push([hx(),50]);stops();run()};
$("#rnd").onclick=()=>{const h=Math.random()*360;const c=x=>DTC.hex(DTC.fromHsl(x,55+Math.random()*30,40+Math.random()*25));s.stops=[[c(h),0],[c(h+40+Math.random()*80),100]];s.a=Math.round(Math.random()*36)*10;stops();run()};
$("#presets").innerHTML=PRE.map(([n,p],i)=>`<button type="button" data-pre="${i}"><span style="background:${(()=>{const o=s;s=Object.assign({shape:"circle",pos:"center",a:0},JSON.parse(JSON.stringify(p)));const g=css();s=o;return g})()}"></span>${n}</button>`).join("");
DT.$$("[data-pre]").forEach(b=>b.onclick=()=>{s=Object.assign({shape:"circle",pos:"center",a:0},JSON.parse(JSON.stringify(PRE[b.dataset.pre][1])));stops();run()});
$("#cp").onclick=e=>DT.copy($("#css").textContent,e.currentTarget);
stops();run();

</script>
</body>
</html>
