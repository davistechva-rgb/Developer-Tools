<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>URL Encoder/Decoder | Developer Tools</title>
<meta name="description" content="Percent-encode text and break a URL into its parts">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="../../icon.svg">
<link rel="manifest" href="../../manifest.webmanifest">
<script>try{var t=localStorage.getItem("dt:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
.sub3{font:700 .95rem/1.3 var(--ui);margin:20px 0 6px}
</style>
</head>
<body>
<main class="wrap">

<div class="row" style="margin-bottom:18px;gap:14px">
 <div class="seg" role="group" aria-label="Encoding mode"><button type="button" data-m="comp">Part of a URL</button><button type="button" data-m="full">Whole URL</button></div>
 <label class="chk"><input type="checkbox" id="plus"> Spaces as + (form data)</label>
</div>
<div class="cols">
 <section class="panel"><div class="panel-h"><label class="h" for="dec">Decoded</label><div class="row"><button class="btn sm" type="button" data-copy="dec">Copy</button><button class="btn sm ghost" type="button" id="clear">Clear</button></div></div>
  <textarea id="dec" spellcheck="false" placeholder="Type or paste text to encode" style="min-height:180px"></textarea></section>
 <section class="panel"><div class="panel-h"><label class="h" for="enc">Encoded</label><button class="btn sm" type="button" data-copy="enc">Copy</button></div>
  <textarea id="enc" spellcheck="false" placeholder="Or paste an encoded string to decode" style="min-height:180px"></textarea>
  <div id="err" class="mt" aria-live="polite"></div></section>
</div>
<p class="hint mt" id="modeHint"></p>
<section class="panel mt" style="margin-top:28px" aria-labelledby="p-h">
 <div class="panel-h"><h2 id="p-h">URL parts</h2><span class="hint">Shown when the decoded text is a full URL</span></div>
 <div id="parts"><p class="hint">Paste a full address like https://example.com/search?q=hello%20world to see its parts.</p></div>
</section>
</main>
<script src="../../shared/tools.js"></script>
<script src="../../shared/kit.js"></script>
<script>
DT.mount("url-encoder");

const $=DT.$,s=Object.assign({m:"comp",plus:false},DT.get("urlenc",{}));
const HINT={comp:"Part of a URL encodes every reserved character, including / ? & = and #. Use it for a single query value or path segment.",full:"Whole URL keeps : / ? & = and # so the address still works. Use it to clean up a complete link with spaces or accents."};
function encode(t){let e=s.m==="comp"?encodeURIComponent(t):encodeURI(t);if(s.plus)e=e.replace(/%20/g,"+");return e}
function decode(t){if(s.plus)t=t.replace(/\+/g," ");return s.m==="comp"?decodeURIComponent(t):decodeURI(t)}
function fromDec(){$("#enc").value=encode($("#dec").value);$("#err").innerHTML="";parts()}
function fromEnc(){try{$("#dec").value=decode($("#enc").value);$("#err").innerHTML="";parts()}
 catch(e){$("#err").innerHTML=`<p class="status bad">Can't decode this<span class="sub">There's a % that isn't followed by two hex digits, or the bytes aren't valid UTF-8. Look for a stray % sign.</span></p>`}}
function row(k,v){return v?`<dt>${k}</dt><dd>${DT.esc(v)}</dd>`:""}
function parts(){const t=$("#dec").value.trim(),o=$("#parts");let u;
 try{u=new URL(t);if(!/^[a-z][a-z0-9+.-]*:/i.test(t))throw 0}catch(e){o.innerHTML=`<p class="hint">Paste a full address like https://example.com/search?q=hello%20world to see its parts.</p>`;return}
 const qs=[...u.searchParams];
 o.innerHTML=`<dl class="kv">${row("Protocol",u.protocol.replace(/:$/,""))}${row("User",u.username)}${row("Host",u.hostname)}${row("Port",u.port)}${row("Path",decodeURIComponent(u.pathname))}${row("Fragment",u.hash.slice(1))}</dl>`+
 (qs.length?`<h3 class="sub3">Query parameters (${qs.length})</h3><div style="overflow-x:auto"><table class="t"><thead><tr><th scope="col">Name</th><th scope="col">Value</th><th></th></tr></thead><tbody>${qs.map(([k,v],i)=>`<tr><td class="code">${DT.esc(k)}</td><td class="code">${DT.esc(v)}</td><td style="width:1%"><button class="btn sm" type="button" data-q="${i}">Copy</button></td></tr>`).join("")}</tbody></table></div>`:"");
 DT.$$("[data-q]",o).forEach(b=>b.onclick=()=>DT.copy(qs[b.dataset.q][1],b))}
function setMode(m){s.m=m;DT.set("urlenc",s);DT.$$("[data-m]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));$("#modeHint").textContent=HINT[m];fromDec()}
DT.$$("[data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#plus").checked=s.plus;$("#plus").onchange=e=>{s.plus=e.target.checked;DT.set("urlenc",s);fromDec()};
$("#dec").addEventListener("input",fromDec);$("#enc").addEventListener("input",fromEnc);
$("#clear").onclick=()=>{$("#dec").value="";fromDec();$("#dec").focus()};
DT.$$("[data-copy]").forEach(b=>b.onclick=()=>DT.copy($("#"+b.dataset.copy).value,b));
setMode(s.m);

</script>
</body>
</html>
