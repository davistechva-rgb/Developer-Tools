<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aspect Ratio Calculator | Developer Tools</title>
<meta name="description" content="Solve for width or height at any ratio">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="../../icon.svg">
<link rel="manifest" href="../../manifest.webmanifest">
<script>try{var t=localStorage.getItem("dt:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
.whg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.whg .lbl{margin:0}.whg input{font-size:1.2rem}
.sec{font:700 1rem/1.3 var(--ui);margin:22px 0 8px}
.ratio output{display:block;font:700 2.6rem/1 var(--mono);font-stretch:100%}.ratio .hint{display:block;margin-top:6px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.presets button{text-align:left;background:none;color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;font:inherit;display:grid}
.presets button b{font-family:var(--mono);font-stretch:87.5%}.presets button span{font-size:.78rem;color:var(--muted)}
.presets button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pbox{height:220px;display:grid;place-items:center;background:var(--inset);border:1px solid var(--line);border-radius:var(--r)}
#box{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);display:grid;place-items:center;transition:width .15s,height .15s}
#box span{font:600 .85rem var(--mono);font-stretch:87.5%}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<main class="wrap">

<div class="cols">
 <section class="panel"><div class="panel-h"><h2>Size</h2></div>
  <div class="whg"><label class="lbl" for="w">Width</label><label class="lbl" for="h">Height</label>
   <input type="number" id="w" min="1"><input type="number" id="h" min="1"></div>
  <div class="row mt"><label class="chk"><input type="checkbox" id="lock"> Keep the ratio when I change one side</label></div>
  <h2 class="sec">Ratio</h2>
  <div class="ratio"><output id="rt"></output><span class="hint" id="rtd"></span></div>
  <div class="presets" id="pre"></div>
  <div class="row mt"><label class="row" style="gap:8px"><span class="lbl" style="margin:0">Custom ratio</span><input type="text" id="cr" placeholder="e.g. 2.39:1" style="width:120px"></label></div>
 </section>
 <section class="panel"><div class="panel-h"><h2>Preview</h2></div>
  <div class="pbox"><div id="box"><span id="boxL"></span></div></div>
  <h2 class="sec">Common sizes at this ratio</h2><div id="sizes" class="sizes"></div>
  <h2 class="sec">CSS</h2><pre class="out" id="css" style="min-height:0"></pre><div class="row mt"><button class="btn sm" type="button" id="cp">Copy CSS</button></div>
 </section>
</div>
</main>
<script src="../../shared/tools.js"></script>
<script src="../../shared/kit.js"></script>
<script>
DT.mount("aspect-ratio");

const $=DT.$,s=Object.assign({w:1920,h:1080,lock:true,rw:16,rh:9},DT.get("aspect",{}));
const PRE=[[16,9,"Widescreen video, most monitors"],[4,3,"Older monitors, iPad"],[16,10,"Laptops, MacBooks"],[21,9,"Ultrawide"],[3,2,"Photos, Surface"],[1,1,"Square posts"],[4,5,"Instagram portrait"],[9,16,"Phone video, Stories"],[2,1,"Twitter/X cards"],[1.91,1,"Link previews (Open Graph)"]];
const COMMON={"16:9":[[640,360],[854,480],[1280,720],[1600,900],[1920,1080],[2560,1440],[3840,2160]],"4:3":[[640,480],[800,600],[1024,768],[1600,1200],[2048,1536]],"16:10":[[1280,800],[1440,900],[1680,1050],[1920,1200],[2560,1600]],"21:9":[[2560,1080],[3440,1440],[5120,2160]],"1:1":[[512,512],[1080,1080],[2048,2048]],"9:16":[[720,1280],[1080,1920]],"4:5":[[1080,1350]],"3:2":[[1080,720],[1500,1000],[3000,2000]],"2:1":[[1200,600]],"1.91:1":[[1200,630]]};
const gcd=(a,b)=>b?gcd(b,a%b):a;
function simp(w,h){if(!(w>0&&h>0))return null;if(Number.isInteger(w)&&Number.isInteger(h)){const g=gcd(w,h);const a=w/g,b=h/g;if(a<=50&&b<=50)return[a,b]}
 const r=w/h;for(const [a,b] of PRE)if(Math.abs(a/b-r)<.005)return[a,b];return[+r.toFixed(2),1]}
function run(){DT.set("aspect",s);const w=+s.w,h=+s.h;$("#w").value=s.w;$("#h").value=s.h;const r=simp(w,h);
 if(!r){$("#rt").textContent="–";return}
 s.rw=r[0];s.rh=r[1];$("#rt").textContent=`${r[0]}:${r[1]}`;const near=PRE.find(([a,b])=>Math.abs(a/b-w/h)/(a/b)<.03&&`${a}:${b}`!==`${r[0]}:${r[1]}`);
 $("#rtd").textContent=(near?`Usually sold as ${near[0]}:${near[1]}. `:"")+`${(w/h).toFixed(4).replace(/0+$/,"").replace(/\.$/,"")} to 1${w>h?", landscape":w<h?", portrait":", square"}`;
 DT.$$("[data-p]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===`${r[0]}:${r[1]}`));
 const mw=260,mh=200,sc=Math.min(mw/w,mh/h);$("#box").style.width=w*sc+"px";$("#box").style.height=h*sc+"px";$("#boxL").textContent=`${w} × ${h}`;
 const key=`${r[0]}:${r[1]}`,L=COMMON[key]||[1,2,4,8].map(k=>[Math.round(r[0]*100*k/ (r[0]>=r[1]?r[0]:r[1])),Math.round(r[1]*100*k/(r[0]>=r[1]?r[0]:r[1]))]);
 $("#sizes").innerHTML=L.map(([a,b])=>`<button type="button" class="btn sm ghost" data-s="${a}x${b}">${a} × ${b}</button>`).join("");
 DT.$$("[data-s]").forEach(b=>b.onclick=()=>{[s.w,s.h]=b.dataset.s.split("x").map(Number);run()});
 $("#css").textContent=`.frame {\n  aspect-ratio: ${r[0]} / ${r[1]};\n  width: 100%;\n}\n\n/* Older browsers */\n.frame-legacy {\n  position: relative;\n  padding-top: ${(h/w*100).toFixed(4).replace(/0+$/,"").replace(/\.$/,"")}%;\n}`}
$("#pre").innerHTML=PRE.map(([a,b,n])=>`<button type="button" data-p="${a}:${b}" title="${n}"><b>${a}:${b}</b><span>${n}</span></button>`).join("");
DT.$$("[data-p]").forEach(b=>b.onclick=()=>{const [a,c]=b.dataset.p.split(":").map(Number);s.h=Math.round(s.w*c/a);run()});
$("#w").oninput=e=>{const nw=+e.target.value;if(s.lock&&nw>0&&s.w>0&&s.h>0)s.h=Math.round(nw*s.rh/s.rw);s.w=nw;run()};
$("#h").oninput=e=>{const nh=+e.target.value;if(s.lock&&nh>0&&s.w>0&&s.h>0)s.w=Math.round(nh*s.rw/s.rh);s.h=nh;run()};
$("#lock").checked=s.lock;$("#lock").onchange=e=>{s.lock=e.target.checked;DT.set("aspect",s)};
$("#cr").onchange=e=>{const m=e.target.value.match(/([\d.]+)\s*[:x/]\s*([\d.]+)/);if(m){s.h=Math.round(s.w*m[2]/m[1]);run()}};
$("#cp").onclick=e=>DT.copy($("#css").textContent,e.currentTarget);
run();

</script>
</body>
</html>
