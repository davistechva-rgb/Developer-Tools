<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>File Size Converter | Developer Tools</title>
<meta name="description" content="Bytes, KB, MB, GB, and KiB, MiB, GiB">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="../../icon.svg">
<link rel="manifest" href="../../manifest.webmanifest">
<script>try{var t=localStorage.getItem("dt:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
#tb th{color:var(--muted);font-weight:700;width:1%}#tb td.code{text-align:right}
#links th{font-weight:400;color:var(--ink)}
.bigr output{display:block;font:700 clamp(1.6rem,4vw,2.4rem)/1.15 var(--mono);font-stretch:87.5%}
.sec{font:700 1rem/1.3 var(--ui);margin:22px 0 8px}
</style>
</head>
<body>
<main class="wrap">

<div class="cols">
 <section class="panel"><div class="panel-h"><h2>Convert a size</h2></div>
  <div class="row"><input type="text" id="v" inputmode="decimal" style="max-width:180px;font-size:1.2rem"><select id="u" aria-label="Unit"></select></div>
  <table class="t mt" id="tb"><thead><tr><th scope="col">Decimal (1000)</th><th></th><th scope="col">Binary (1024)</th><th></th></tr></thead><tbody></tbody></table>
  <p class="hint mt">Drive makers and macOS count in 1000s. Windows counts in 1024s but labels them KB, MB, GB. That's why a “1 TB” drive shows as about 931 GB in Windows.</p></section>
 <section class="panel"><div class="panel-h"><h2>How long will it take?</h2></div>
  <div class="row"><div><label class="lbl" for="ts">Size</label><div class="row" style="gap:6px"><input type="text" id="ts" inputmode="decimal" style="width:120px"><select id="tsu"><option>MB</option><option selected>GB</option><option>TB</option><option>MiB</option><option>GiB</option><option>TiB</option></select></div></div>
   <div><label class="lbl" for="sp">Speed</label><div class="row" style="gap:6px"><input type="text" id="sp" inputmode="decimal" style="width:120px"><select id="spu"><option value="1e6">Mbps</option><option value="1e9">Gbps</option><option value="8e6">MB/s</option><option value="8e3">KB/s</option></select></div></div>
   <div><label class="lbl" for="eff">Real-world efficiency</label><select id="eff"><option value="1">100% (theoretical)</option><option value="0.9">90%</option><option value="0.8" selected>80% (typical)</option><option value="0.6">60% (busy or Wi-Fi)</option></select></div></div>
  <div class="bigr mt" id="tr" aria-live="polite"></div>
  <h2 class="sec">Common links</h2><table class="t" id="links"><tbody></tbody></table></section>
</div>
</main>
<script src="../../shared/tools.js"></script>
<script src="../../shared/kit.js"></script>
<script>
DT.mount("file-size");

const $=DT.$;const DEC=[["B",1],["KB",1e3],["MB",1e6],["GB",1e9],["TB",1e12],["PB",1e15]],BIN=[["B",1],["KiB",1024],["MiB",1048576],["GiB",1073741824],["TiB",1099511627776],["PiB",1125899906842624]];
const ALL=[["bits",.125],["B",1],["KB",1e3],["MB",1e6],["GB",1e9],["TB",1e12],["PB",1e15],["KiB",1024],["MiB",1048576],["GiB",1073741824],["TiB",1099511627776]];
const s=Object.assign({v:"1",u:"TB",ts:"50",tsu:"GB",sp:"100",spu:"1e6",eff:"0.8"},DT.get("fsize",{}));
$("#u").innerHTML=ALL.map(([n])=>`<option>${n}</option>`).join("");
const f=x=>(+x.toPrecision(8)).toLocaleString(undefined,{maximumFractionDigits:6});
function dur(sec){if(!isFinite(sec))return"–";if(sec<1)return"Under a second";const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),x=Math.round(sec%60);return[d&&`${d} day${d>1?"s":""}`,h&&`${h} hr`,m&&`${m} min`,!d&&x&&`${x} sec`].filter(Boolean).join(" ")}
function run(){DT.set("fsize",s);const v=parseFloat(String(s.v).replace(/,/g,""));const b=(isNaN(v)?0:v)*ALL.find(x=>x[0]===s.u)[1];
 $("#tb tbody").innerHTML=DEC.map((d,i)=>`<tr><td class="code">${f(b/d[1])}</td><th scope="row">${d[0]}</th><td class="code">${f(b/BIN[i][1])}</td><th scope="row">${BIN[i][0]}</th></tr>`).join("")+`<tr><td class="code">${f(b*8)}</td><th scope="row">bits</th><td></td><td></td></tr>`;
 const tb={MB:1e6,GB:1e9,TB:1e12,MiB:1048576,GiB:1073741824,TiB:1099511627776}[s.tsu]*(parseFloat(s.ts)||0),bps=(parseFloat(s.sp)||0)*+s.spu*+s.eff;
 $("#tr").innerHTML=`<output>${dur(tb*8/bps)}</output><p class="hint">To move ${f(parseFloat(s.ts)||0)} ${s.tsu} at an effective ${f(bps/1e6)} Mbps.</p>`;
 $("#links tbody").innerHTML=[["Cable or DSL upload",20e6],["Fast home internet",300e6],["Gigabit fiber or Ethernet",1e9],["Wi-Fi 6 (realistic)",600e6],["USB 3.0 (realistic)",2.4e9],["10 Gb Ethernet",1e10]].map(([n,r])=>`<tr><th scope="row">${n}</th><td class="code">${dur(tb*8/(r*+s.eff))}</td></tr>`).join("")}
[["v","value","input"],["u","value","change"],["ts","value","input"],["tsu","value","change"],["sp","value","input"],["spu","value","change"],["eff","value","change"]].forEach(([id,p,ev])=>{$("#"+id)[p]=s[id];$("#"+id).addEventListener(ev,e=>{s[id]=e.target[p];run()})});
run();

</script>
</body>
</html>
