<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YAML Formatter | Developer Tools</title>
<meta name="description" content="Clean up and check YAML indentation">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="../../icon.svg">
<link rel="manifest" href="../../manifest.webmanifest">
<script>try{var t=localStorage.getItem("dt:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
.out.stale{opacity:.35}.snip{margin-top:10px;color:var(--bad)}
</style>
</head>
<body>
<main class="wrap">

<div class="row spread" style="margin-bottom:18px">
 <div class="row">
  <label class="row" style="gap:8px"><span class="lbl" style="margin:0">Indent</span><select id="ind"><option value="2">2 spaces</option><option value="4">4 spaces</option></select></label>
  <label class="chk"><input type="checkbox" id="sort"> Sort keys A–Z</label>
  <label class="chk"><input type="checkbox" id="flow"> Keep short lists on one line</label>
 </div>
</div>
<div class="cols">
 <section class="panel"><div class="panel-h"><label class="h" for="in">YAML</label><div class="row"><button class="btn sm ghost" type="button" id="sample">Load example</button><button class="btn sm ghost" type="button" id="clear">Clear</button></div></div>
  <textarea id="in" class="nowrap" spellcheck="false" placeholder="Paste YAML here" style="min-height:420px"></textarea></section>
 <section class="panel"><div class="panel-h"><h2>Formatted</h2><div class="row"><button class="btn sm" type="button" id="copy" disabled>Copy</button><button class="btn sm" type="button" id="dl" disabled>Download</button></div></div>
  <pre class="out" id="out" tabindex="0" aria-label="Formatted YAML" style="min-height:420px"></pre>
  <div id="msg" class="mt" aria-live="polite"></div></section>
</div>
<p class="hint mt">Formatting rebuilds the file from its data, so comments are removed and anchors are expanded. Check the result before replacing a config file.</p>
</main>
<script src="../../shared/vendor/js-yaml.min.js"></script>
<script src="../../shared/tools.js"></script>
<script src="../../shared/kit.js"></script>
<script>
DT.mount("yaml-formatter");

const $=DT.$,s=Object.assign({ind:"2",sort:false,flow:false},DT.get("yamlfmt",{}));const SAMPLE="# docker-compose for a small office\nservices:\n    web:\n      image: nginx:1.27\n      ports: [\"80:80\", \"443:443\"]\n      restart: unless-stopped\n    backup:\n        image: restic/restic\n        environment: {RESTIC_REPOSITORY: /backups, TZ: America/New_York}\n        volumes:\n         - ./data:/data:ro\n         - ./backups:/backups\n";let result="";
$("#ind").value=s.ind;$("#sort").checked=s.sort;$("#flow").checked=s.flow;
function run(){DT.set("yamlfmt",s);const t=$("#in").value,o=$("#out"),m=$("#msg");
 if(!t.trim()){o.textContent="";m.innerHTML="";result="";$("#copy").disabled=$("#dl").disabled=true;return}
 let docs;try{docs=jsyaml.loadAll(t,null,{schema:jsyaml.CORE_SCHEMA})}catch(e){o.classList.add("stale");const mk=e.mark||{};
  m.innerHTML=`<p class="status bad">Not valid YAML${mk.line!=null?` at line ${mk.line+1}, column ${mk.column+1}`:""}<span class="sub">${DT.esc((e.reason||e.message).replace(/^./,c=>c.toUpperCase()))}.</span></p>${mk.snippet?`<pre class="out snip" style="min-height:0">${DT.esc(mk.snippet)}</pre>`:""}`;
  $("#copy").disabled=$("#dl").disabled=true;return}
 result=docs.map(d=>jsyaml.dump(d,{indent:+s.ind,sortKeys:s.sort,noRefs:true,lineWidth:-1,flowLevel:-1,schema:jsyaml.CORE_SCHEMA})).join("---\n");
 if(s.flow){const f=flowify(result);try{if(JSON.stringify(jsyaml.loadAll(f,null,{schema:jsyaml.CORE_SCHEMA}))===JSON.stringify(docs))result=f}catch(e){}}
 o.classList.remove("stale");o.innerHTML=hl(result);
 m.innerHTML=`<p class="status good">Valid YAML<span class="sub">${docs.length} document${docs.length===1?"":"s"}, ${result.split("\n").length-1} lines.</span></p>`;$("#copy").disabled=$("#dl").disabled=false}
function flowify(y){const L=y.split("\n"),out=[];
 const scalar=v=>!/^[\[\]{}&*!|>%@`#-]/.test(v)&&!/,|#|: |:$/.test(v)&&!/^[^'"]*?:\s/.test(v);
 for(let i=0;i<L.length;i++){const m=L[i].match(/^( *)(- )?([^\s#][^#]*:)$/);
  if(m){const ind=m[1]+(m[2]?"  ":"")+"  ",items=[];let j=i+1;
   while(j<L.length&&L[j].startsWith(ind+"- ")&&!L[j].startsWith(ind+"  ")){const v=L[j].slice(ind.length+2);if(!scalar(v))break;items.push(v);j++}
   const next=L[j]||"";
   if(items.length>=1&&items.length<=10&&!next.startsWith(ind+"  ")&&!(next.startsWith(ind+"- "))&&items.join(", ").length<=60){out.push(L[i]+" ["+items.join(", ")+"]");i=j-1;continue}}
  out.push(L[i])}
 return out.join("\n")}
function hl(y){return y.split("\n").map(l=>{let e=DT.esc(l);return e.replace(/^(\s*-?\s*)([^\s:#'"][^:#]*?|"[^"]*"|'[^']*')(:)(?=\s|$)/,'$1<span class="j-key">$2</span>$3')
 .replace(/(:\s+|-\s+)(true|false|null|~)$/,'$1<span class="j-bool">$2</span>').replace(/(:\s+|-\s+)(-?\d[\d.]*)$/,'$1<span class="j-num">$2</span>').replace(/^(---)$/,'<span class="j-null">$1</span>')}).join("\n")}
$("#in").addEventListener("input",DT.debounce(run,200));
$("#ind").onchange=e=>{s.ind=e.target.value;run()};$("#sort").onchange=e=>{s.sort=e.target.checked;run()};$("#flow").onchange=e=>{s.flow=e.target.checked;run()};
$("#copy").onclick=e=>DT.copy(result,e.currentTarget);$("#dl").onclick=()=>DT.download("formatted.yaml",result,"text/yaml");
$("#sample").onclick=()=>{$("#in").value=SAMPLE;run()};$("#clear").onclick=()=>{$("#in").value="";run();$("#in").focus()};
run();

</script>
</body>
</html>
