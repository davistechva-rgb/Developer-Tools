<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Password Generator | Developer Tools</title>
<meta name="description" content="Random passwords and passphrases from your browser's secure random source">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="../../icon.svg">
<link rel="manifest" href="../../manifest.webmanifest">
<script>try{var t=localStorage.getItem("dt:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="../../shared/kit.css">
<style>
.pwlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pwlist li{display:flex;gap:10px;align-items:center;background:var(--inset);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 14px}
.pw{flex:1;font-size:1.02rem;word-break:break-all;line-height:1.5}
.pwlist li:first-child{border-color:var(--line-strong)}
.pwlist li:first-child .pw{font-size:1.2rem;font-weight:600}
</style>

<body>
<main class="wrap">

<div class="cols wide-left">
 <section class="panel" aria-labelledby="res-h">
  <div class="panel-h"><h2 id="res-h">Your passwords</h2>
   <div class="row"><button class="btn sm" id="copyAll" type="button">Copy all</button><button class="btn primary" id="gen" type="button">Generate new</button></div></div>
  <ol id="list" class="pwlist"></ol>
  <div class="strength mt"><div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
   <p class="hint mt" id="ent"></p></div>
 </section>
 <section class="panel" aria-labelledby="opt-h">
  <div class="panel-h"><h2 id="opt-h">Options</h2>
   <div class="seg" role="group" aria-label="Type"><button type="button" data-mode="chars">Characters</button><button type="button" data-mode="words">Passphrase</button></div></div>
  <div id="charsOpts">
   <label class="lbl" for="len">Length: <span id="lenV" class="code"></span></label>
   <input type="range" id="len" min="4" max="128">
   <div class="row mt">
    <label class="chk"><input type="checkbox" id="up"> A–Z</label>
    <label class="chk"><input type="checkbox" id="lo"> a–z</label>
    <label class="chk"><input type="checkbox" id="di"> 0–9</label>
    <label class="chk"><input type="checkbox" id="sy"> Symbols</label>
   </div>
   <div class="row mt"><label class="chk"><input type="checkbox" id="amb"> Leave out look-alikes (I l 1 O 0 o)</label></div>
   <label class="lbl mt" for="ex">Never use these characters</label>
   <input type="text" id="ex" placeholder="For example: &quot;'`\" spellcheck="false" autocomplete="off">
   <label class="lbl mt" for="sym">Symbol set</label>
   <input type="text" id="sym" spellcheck="false" autocomplete="off">
  </div>
  <div id="wordsOpts" hidden>
   <label class="lbl" for="wc">Words: <span id="wcV" class="code"></span></label>
   <input type="range" id="wc" min="3" max="12">
   <div class="row mt">
    <label class="lbl" for="sep" style="margin:0">Separator</label>
    <select id="sep"><option value="-">Hyphen -</option><option value=" ">Space</option><option value=".">Period .</option><option value="_">Underscore _</option><option value="">None</option></select>
   </div>
   <div class="row mt"><label class="chk"><input type="checkbox" id="cap"> Capitalize words</label><label class="chk"><input type="checkbox" id="num"> Add a number</label></div>
   <p class="hint mt">Words come from the EFF short word list (1,296 words), picked with your browser's secure random generator.</p>
  </div>
  <label class="lbl mt" for="count">How many</label>
  <input type="number" id="count" min="1" max="50" style="max-width:120px">
  <p class="hint mt">Passwords are made on this device and never sent anywhere.</p>
 </section>
</div>
</main>
<script src="../../shared/tools.js"></script>
