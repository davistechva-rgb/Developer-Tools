<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JSON Formatter | Developer Tools</title>
<meta name="description" content="Pretty-print, minify, and sort JSON with syntax colors">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="../../icon.svg">
<link rel="manifest" href="../../manifest.webmanifest">
<script>try{var t=localStorage.getItem("dt:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
.out.stale{opacity:.35}
</style>
</head>
<body>
<main class="wrap">

<div class="row spread" style="margin-bottom:18px">
 <div class="row">
  <label class="row" style="gap:8px"><span class="lbl" style="margin:0">Indent</span><select id="ind"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="tab">Tab</option></select></label>
  <label class="chk"><input type="checkbox" id="sort"> Sort keys A–Z</label>
 </div>
 <div class="row"><button class="btn primary" type="button" id="fmt">Format</button><button class="btn" type="button" id="min">Minify</button></div>
</div>
<div class="cols">
 <section class="panel"><div class="panel-h"><label class="h" for="in">Input</label><div class="row"><button class="btn sm ghost" type="button" id="sample">Load example</button><button class="btn sm ghost" type="button" id="clear">Clear</button></div></div>
  <textarea id="in" class="nowrap" spellcheck="false" placeholder="Paste JSON here" style="min-height:420px"></textarea>
  <p class="hint mt" id="inInfo"></p></section>
 <section class="panel"><div class="panel-h"><h2>Output</h2><div class="row"><button class="btn sm" type="button" id="copy" disabled>Copy</button><button class="btn sm" type="button" id="dl" disabled>Download</button></div></div>
  <pre class="out" id="out" tabindex="0" aria-label="Formatted JSON" style="min-height:420px"></pre>
  <div id="msg" class="mt" aria-live="polite"></div></section>
</div>
</main>
<script src="../../shared/tools.js"></script>
<script src="../../shared/kit.js"></script>
<script>
DT.mount("json-formatter");

const $=DT.$,s=Object.assign({ind:"2",sort:false,last:"fmt"},DT.get("jsonfmt",{}));
const SAMPLE="{\"site\":\"davis-tech-support.com\",\"services\":[\"Managed IT\",\"Networking\",\"Google Workspace\"],\"clients\":{\"residential\":true,\"nonprofit\":true,\"count\":42},\"lastAudit\":null,\"uptime\":99.97}";
let result="";
$("#ind").value=s.ind;$("#sort").checked=s.sort;
function run(kind){if(kind)s.last=kind;DT.set("jsonfmt",s);
 const t=$("#in").value,o=$("#out"),m=$("#msg");
 $("#inInfo").textContent=t?DT.bytes(new Blob([t]).size)+" in":"";
 if(!t.trim()){o.innerHTML="";m.innerHTML="";result="";$("#copy").disabled=$("#dl").disabled=true;return}
 let v;try{v=JSON.parse(t)}catch(e){const er=DT.jsonError(t,e);o.classList.add("stale");
  m.innerHTML=`<p class="status bad">Not valid JSON${er.line?` at line ${er.line}, column ${er.col}`:""}<span class="sub">${DT.esc(er.msg)}. <a href="../json-validator/index.html">Open the validator</a> for more help.</span></p>`;$("#copy").disabled=$("#dl").disabled=true;return}
 if(s.sort)v=DT.sortKeys(v);
 result=s.last==="min"?JSON.stringify(v):JSON.stringify(v,null,s.ind==="tab"?"\t":+s.ind);
 o.classList.remove("stale");o.innerHTML=DT.hlJSON(result);
 m.innerHTML=`<p class="hint">${s.last==="min"?"Minified":"Formatted"}: ${DT.bytes(new Blob([result]).size)}, ${result.split("\n").length.toLocaleString()} line${result.includes("\n")?"s":""}.</p>`;
 $("#copy").disabled=$("#dl").disabled=false}
$("#in").addEventListener("input",DT.debounce(()=>run(),200));
$("#fmt").onclick=()=>run("fmt");$("#min").onclick=()=>run("min");
$("#ind").onchange=e=>{s.ind=e.target.value;run("fmt")};$("#sort").onchange=e=>{s.sort=e.target.checked;run()};
$("#copy").onclick=e=>DT.copy(result,e.currentTarget);
$("#dl").onclick=()=>DT.download(s.last==="min"?"data.min.json":"data.json",result,"application/json");
$("#sample").onclick=()=>{$("#in").value=SAMPLE;run("fmt")};
$("#clear").onclick=()=>{$("#in").value="";run();$("#in").focus()};
$("#in").addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey&&$("#in").value){e.preventDefault();document.execCommand("insertText",false,"  ")}});
run();

</script>
</body>
</html>
