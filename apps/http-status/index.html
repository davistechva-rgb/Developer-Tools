<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HTTP Status Code Reference | Developer Tools</title>
<meta name="description" content="Every status code with what it means and when to use it">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="../../icon.svg">
<link rel="manifest" href="../../manifest.webmanifest">
<script>try{var t=localStorage.getItem("dt:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:none;color:var(--ink);font:700 .88rem var(--ui);padding:7px 12px;border-radius:var(--r);cursor:pointer}
.chip:hover{border-color:var(--line-strong)}.chip[aria-pressed=true]{background:var(--line-strong);color:var(--bg);border-color:var(--line-strong)}
.rt td{line-height:1.5}.rt td.code{white-space:nowrap;font-weight:600;color:var(--accent)}
.rt td.name{font-weight:700;min-width:140px}.rt td.dim{color:var(--muted);font-size:.9rem;min-width:200px}
.rt td.ex{font-family:var(--mono);font-stretch:87.5%;font-size:.82rem;color:var(--muted);word-break:break-all;min-width:200px}
.tg{display:inline-block;border:1px solid var(--line);border-radius:var(--r);padding:1px 7px;font-size:.78rem;color:var(--muted);white-space:nowrap}
kbd{display:inline-block;font:600 .8rem/1 var(--mono);font-stretch:87.5%;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;padding:4px 6px;background:var(--inset);white-space:nowrap}
.plus{color:var(--muted);margin:0 2px;font-size:.8rem}
.rt td.keys{white-space:nowrap}
</style>
</head>
<body>
<main class="wrap">

<section class="panel">
 <div class="row"><label class="sr" for="q">Search</label><input type="search" id="q" placeholder="Search codes, like 502 or timeout" autocomplete="off" style="flex:1;min-width:220px;font-family:var(--ui);font-size:1.05rem"><span class="hint" id="cnt"></span></div>
 <div class="chips mt" id="chips" role="group" aria-label="Filter"></div>
</section>
<section class="panel" style="margin-top:28px"><div style="overflow-x:auto"><table class="t rt" id="tbl"><thead></thead><tbody></tbody></table></div>
 <p class="hint mt" id="empty" hidden>Nothing matches that search.</p><p class="hint mt">Type a code or a word like “timeout” or “cookie”.</p></section>
</main>
<script src="../../shared/tools.js"></script>
<script src="../../shared/kit.js"></script>
<script>
DT.mount("http-status");

const $=DT.$;const COLS=[{"h": "Code", "i": 1, "cls": "code"}, {"h": "Name", "i": 2, "cls": "name"}, {"h": "What it means", "i": 3}, {"h": "Common causes and fixes", "i": 4, "cls": "dim"}],ROWS=[["1xx Info", "100", "Continue", "The server got the request headers; the client can send the body.", ""], ["1xx Info", "101", "Switching Protocols", "The server is switching protocols, usually to WebSocket.", ""], ["1xx Info", "102", "Processing", "Still working on it (WebDAV). Prevents the client from timing out.", ""], ["1xx Info", "103", "Early Hints", "Lets the browser start loading linked files before the final response.", ""], ["2xx Success", "200", "OK", "The request worked.", ""], ["2xx Success", "201", "Created", "A new resource was created. The Location header says where.", ""], ["2xx Success", "202", "Accepted", "Accepted for processing, but not finished yet.", ""], ["2xx Success", "203", "Non-Authoritative Information", "Success, but a proxy changed the response.", ""], ["2xx Success", "204", "No Content", "Success with nothing to send back. Common after a delete or save.", ""], ["2xx Success", "205", "Reset Content", "Success; the client should reset its form or view.", ""], ["2xx Success", "206", "Partial Content", "Part of a file was sent, for resumed downloads and video seeking.", ""], ["2xx Success", "207", "Multi-Status", "Several results in one response (WebDAV).", ""], ["2xx Success", "208", "Already Reported", "Item already listed earlier in this response (WebDAV).", ""], ["2xx Success", "226", "IM Used", "The server applied a change encoding to the result.", ""], ["3xx Redirect", "300", "Multiple Choices", "More than one option; the client should pick.", ""], ["3xx Redirect", "301", "Moved Permanently", "The address changed for good. Browsers and search engines update to the new one.", "Use for domain moves and old page addresses."], ["3xx Redirect", "302", "Found", "Temporarily at another address. Keep using the original.", "Browsers may switch POST to GET; use 307 to prevent that."], ["3xx Redirect", "303", "See Other", "Go GET a different address, often after a form submit.", ""], ["3xx Redirect", "304", "Not Modified", "The cached copy is still good. Nothing new was sent.", ""], ["3xx Redirect", "307", "Temporary Redirect", "Temporarily moved; repeat the same method and body.", ""], ["3xx Redirect", "308", "Permanent Redirect", "Permanently moved; repeat the same method and body.", ""], ["4xx Client error", "400", "Bad Request", "The server couldn't understand the request.", "Malformed JSON, bad query string, or an oversized or corrupt cookie. Clearing cookies often fixes it for users."], ["4xx Client error", "401", "Unauthorized", "Not signed in, or the credentials were rejected.", "Missing or expired token, wrong API key, or a clock that's badly off."], ["4xx Client error", "402", "Payment Required", "Reserved; some APIs use it when billing or a quota lapses.", ""], ["4xx Client error", "403", "Forbidden", "Signed in or not, you aren't allowed to see this.", "File permissions, IP restrictions, a firewall or WAF rule, or a missing index file with directory listing off."], ["4xx Client error", "404", "Not Found", "Nothing exists at that address.", "Typo in the URL, a moved page without a redirect, or a wrong deploy folder."], ["4xx Client error", "405", "Method Not Allowed", "That method (like POST) isn't allowed here.", "Posting to a static host, or an API route that only accepts GET."], ["4xx Client error", "406", "Not Acceptable", "Can't return a format the client accepts.", ""], ["4xx Client error", "407", "Proxy Authentication Required", "A proxy between you and the site needs you to sign in.", "Corporate or school web filter credentials."], ["4xx Client error", "408", "Request Timeout", "The client took too long to send the request.", "Slow or dropped connection."], ["4xx Client error", "409", "Conflict", "The request clashes with the current state, like an edit conflict.", ""], ["4xx Client error", "410", "Gone", "Removed on purpose and not coming back.", ""], ["4xx Client error", "411", "Length Required", "The server needs a Content-Length header.", ""], ["4xx Client error", "412", "Precondition Failed", "A condition in the request headers wasn't met.", ""], ["4xx Client error", "413", "Content Too Large", "The upload is bigger than the server allows.", "Raise client_max_body_size (nginx) or the upload limit in PHP or IIS."], ["4xx Client error", "414", "URI Too Long", "The address is too long for the server.", "Huge query strings; send the data in a POST body instead."], ["4xx Client error", "415", "Unsupported Media Type", "The server doesn't accept that content type.", "Wrong or missing Content-Type header on an API call."], ["4xx Client error", "416", "Range Not Satisfiable", "The requested byte range doesn't exist in the file.", ""], ["4xx Client error", "417", "Expectation Failed", "The server can't meet the Expect header.", ""], ["4xx Client error", "418", "I'm a teapot", "An April Fools' joke code. Some sites use it to turn away bots.", ""], ["4xx Client error", "421", "Misdirected Request", "This server can't answer for that host name.", "TLS certificate or connection reuse across different host names."], ["4xx Client error", "422", "Unprocessable Content", "Well-formed, but the data fails validation.", "A required field is missing or a value is invalid."], ["4xx Client error", "423", "Locked", "The resource is locked (WebDAV).", ""], ["4xx Client error", "424", "Failed Dependency", "Failed because an earlier request failed (WebDAV).", ""], ["4xx Client error", "425", "Too Early", "The server won't risk processing a replayable request.", ""], ["4xx Client error", "426", "Upgrade Required", "Switch to a newer protocol, like TLS.", ""], ["4xx Client error", "428", "Precondition Required", "The server requires a conditional request.", ""], ["4xx Client error", "429", "Too Many Requests", "Rate limit hit. Slow down.", "Check the Retry-After header. Common with APIs, logins, and scripted checks."], ["4xx Client error", "431", "Request Header Fields Too Large", "The headers are too big.", "Usually too many or too-large cookies. Clear cookies for the site."], ["4xx Client error", "451", "Unavailable For Legal Reasons", "Blocked for legal reasons.", ""], ["5xx Server error", "500", "Internal Server Error", "Something broke on the server.", "Check the server's error log. Often a code error, bad config, or a failed database connection."], ["5xx Server error", "501", "Not Implemented", "The server doesn't support that feature or method.", ""], ["5xx Server error", "502", "Bad Gateway", "A proxy or load balancer got a bad answer from the server behind it.", "The app server crashed or isn't running, or the proxy points at the wrong port."], ["5xx Server error", "503", "Service Unavailable", "Temporarily down, overloaded, or in maintenance.", "App pool stopped (IIS), maintenance mode, or resource limits hit."], ["5xx Server error", "504", "Gateway Timeout", "A proxy waited too long for the server behind it.", "A slow database query or script; raise the proxy timeout or fix the slow part."], ["5xx Server error", "505", "HTTP Version Not Supported", "The server doesn't support that HTTP version.", ""], ["5xx Server error", "506", "Variant Also Negotiates", "Server configuration loop during content negotiation.", ""], ["5xx Server error", "507", "Insufficient Storage", "The server is out of space to finish the request.", "Disk full."], ["5xx Server error", "508", "Loop Detected", "The server hit an infinite loop (WebDAV).", ""], ["5xx Server error", "510", "Not Extended", "More extensions are required.", ""], ["5xx Server error", "511", "Network Authentication Required", "You have to sign in to the network first.", "Hotel, airport, or guest Wi-Fi captive portals."], ["Unofficial", "499", "Client Closed Request (nginx)", "The visitor gave up before the server answered.", "Slow backend; see why requests take so long."], ["Unofficial", "520", "Unknown Error (Cloudflare)", "The origin server sent an empty or unexpected response.", "Origin crashed, or headers too large."], ["Unofficial", "521", "Web Server Is Down (Cloudflare)", "The origin server refused the connection.", "Web server stopped, or a firewall blocking Cloudflare's IP ranges."], ["Unofficial", "522", "Connection Timed Out (Cloudflare)", "Couldn't connect to the origin in time.", "Origin overloaded, offline, or firewalled."], ["Unofficial", "523", "Origin Is Unreachable (Cloudflare)", "No route to the origin.", "Wrong IP in the DNS record."], ["Unofficial", "524", "A Timeout Occurred (Cloudflare)", "Connected, but the origin took over 100 seconds to answer.", "Long-running scripts or reports."], ["Unofficial", "525", "SSL Handshake Failed (Cloudflare)", "Couldn't make a secure connection to the origin.", "No or wrong certificate on the origin, or SSL mode mismatch."], ["Unofficial", "526", "Invalid SSL Certificate (Cloudflare)", "The origin's certificate isn't valid.", "Expired or self-signed certificate with Full (strict) mode."]],CAT=0;const DEF="";
const cats=[...new Set(ROWS.map(r=>r[CAT]))];const key="ref.http-status";let cur=DT.get(key,DEF||"");if(cur&&!cats.includes(cur))cur="";
$("#chips").innerHTML=(DEF?"":`<button type="button" class="chip" data-c="">All</button>`)+cats.map(c=>`<button type="button" class="chip" data-c="${DT.attr(c)}">${DT.esc(c)}</button>`).join("");
const kbd=v=>v.split(/\s+or\s+/).map(alt=>alt.split(/(?<=\S)\+(?=\S)/).map(k=>`<kbd>${DT.esc(k)}</kbd>`).join('<span class="plus">+</span>')).join(' <span class="hint">or</span> ');
function render(){DT.set(key,cur);const words=$("#q").value.toLowerCase().trim().split(/\s+/).filter(Boolean);
 DT.$$(".chip").forEach(b=>b.setAttribute("aria-pressed",!words.length&&b.dataset.c===cur));
 const vis=ROWS.filter(r=>(!cur||r[CAT]===cur||words.length)&&words.every(w=>r.join(" ").toLowerCase().includes(w)));
 const multi=new Set(vis.map(r=>r[CAT])).size>1;const show=COLS.filter(c=>vis.some(r=>r[c.i])&&(!c.grp||multi));
 $("#tbl thead").innerHTML=`<tr>${show.map(c=>`<th scope="col">${c.h2&&show.some(x=>x.i===c.pair)?c.h2:c.h}</th>`).join("")}</tr>`;
 $("#tbl tbody").innerHTML=vis.map(r=>`<tr>${show.map(c=>`<td class="${c.cls||""}">${!r[c.i]?"":c.cls==="keys"?kbd(r[c.i]):c.cls==="tag"?`<span class="tg">${DT.esc(r[c.i])}</span>`:DT.esc(r[c.i])}</td>`).join("")}</tr>`).join("");
 $("#cnt").textContent=`${vis.length} of ${ROWS.length}`;$("#empty").hidden=vis.length>0}
DT.$$(".chip").forEach(b=>b.onclick=()=>{cur=b.dataset.c;render()});$("#q").addEventListener("input",DT.debounce(render,80));
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}});
render();

</script>
</body>
</html>
